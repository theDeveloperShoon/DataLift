name: Build

on:
  push:
    branches:
      - main

    # Allows you to run this workflow from the Actions tab
    workflow_dispatch:

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sets Current Date As Env Variable
      - name: Set Current Date as env variable
        run: echo "date_today=$(date +%Y-%m-%d)" >> $GITHUB_EVN

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Runs gradle tests
        run: ./gradlew test

      - name: Build gradle project
        run: ./gradlew build

      - name: Build apk debug project (APK)
        run: ./gradlew assembleDebug

      - name: Build apk release project (APK)
        run: ./gradlew assembleRelease

      # Create Bundle AAB Release
      - name: Build app bundle release (AAB)
        run: ./gradlew app:bundleRelease

      - name: Upload APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.date_today}} - APK(s) debug generated
          path: app/build/outputs/apk/debug/

      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.date_today}} - APK(s) release generated
          path: app/build/outputs/apk/release/

      - name: Upload AAB (App Bundle) Release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.date_today}} - APK(s) release generated
          path: app/build/outputs/bundle/release/

#      - name: Setup Gradle
#        uses: actions/setup-gradle@v4

#      - name: Build
#        run: ./gradlew :app:assembleDebug